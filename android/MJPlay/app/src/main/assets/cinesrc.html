<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://cinesrc.st; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>MJ Player · CineSrc</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; background: black }
main { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden }
iframe, #surface, #startup { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0 }
#surface { background: transparent }
#startup { background: black; pointer-events: none }
</style>
</head>
<body>
<main>
    <iframe id="video" title="CineSrc video" sandbox="allow-scripts allow-same-origin" allow="autoplay; encrypted-media" tabindex="-1"></iframe>
    <button id="surface" aria-label="Show playback controls"></button>
    <div id="startup" aria-hidden="true"></div>
</main>
<script>
const config = __MJ_CONFIG__;
const origin = 'https://cinesrc.st';
const frame = document.getElementById('video');
const startup = document.getElementById('startup');
const state = { currentTime: 0, duration: 0, paused: true, muted: true, ended: false };
let started = false;
let resume = config.resume;
let saveAfter = 0;
let unmuteRequested = false;
let error = null;
let surfaceTaps = 0;

function send(command, args = []) {
    frame.contentWindow?.postMessage({ type: 'cinesrc:command', command, args }, origin);
}
function poll() {
    for (const command of ['getCurrentTime', 'getDuration', 'getPaused', 'getMuted']) send(command);
}
function seekTo(seconds) {
    if (state.duration > 0) send('seek', [Math.max(0, Math.min(state.duration, seconds))]);
}
function togglePlayback() {
    send(state.paused ? 'play' : 'pause');
}
window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow || event.origin !== origin) return;
    const data = event.data;
    if (!data || typeof data.type !== 'string' || !data.type.startsWith('cinesrc:')) return;
    if ((data.tmdbId != null && String(data.tmdbId) !== String(config.id)) ||
        (data.mediaType != null && data.mediaType !== config.type) ||
        (config.type === 'tv' && ((data.season != null && Number(data.season) !== config.season) ||
        (data.episode != null && Number(data.episode) !== config.episode)))) return;
    const previous = state.currentTime;
    const fields = { getCurrentTime: 'currentTime', getDuration: 'duration', getPaused: 'paused', getMuted: 'muted' };
    for (const field of Object.values(fields)) {
        const value = data.type === 'cinesrc:response' && fields[data.command] === field ? data.result : data[field];
        if (field === 'paused' || field === 'muted') {
            if (typeof value === 'boolean') state[field] = value;
        } else if (Number.isFinite(value) && value >= 0 && value <= 86400) {
            state[field] = value;
        }
    }
    if (data.type === 'cinesrc:play') {
        state.paused = false;
        state.ended = false;
    }
    if (data.type === 'cinesrc:pause') state.paused = true;
    if (data.type === 'cinesrc:ended') {
        state.ended = true;
        state.paused = true;
    }
    if (!state.paused && state.currentTime > previous) {
        started = true;
        startup.hidden = true;
        error = null;
    }
    if (started && resume > 0 && state.duration > 0) {
        seekTo(resume);
        resume = 0;
        saveAfter = Date.now() + 4000;
    }
    if (started && state.muted && !unmuteRequested) {
        unmuteRequested = true;
        send('setMuted', [false]);
    }
    if (data.type === 'cinesrc:command-error') {
        error = 'CineSrc could not apply that control.';
    }
});
window.mjPause = () => send('pause');
window.mjToggle = togglePlayback;
window.mjSeek = seekTo;
window.mjMute = () => send('setMuted', [!state.muted]);
window.mjSpeed = rate => send('setPlaybackRate', [rate]);
document.getElementById('surface').onclick = () => { surfaceTaps++; };
window.mjSnapshot = () => ({
    position: state.currentTime,
    duration: state.duration,
    canSave: started && resume === 0 && Date.now() >= saveAfter,
    paused: state.paused,
    muted: state.muted,
    ended: state.ended,
    started,
    surfaceTaps,
    error
});
frame.onload = poll;
frame.src = config.url;
setInterval(() => { if (!document.hidden) poll(); }, 2000);
setTimeout(() => {
    if (!started) error = 'CineSrc did not start. Try Play, Retry CineSrc, or MJ native player.';
}, 30000);
</script>
</body>
</html>
